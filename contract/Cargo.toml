[package]
name = "drill-vault"
description = "A NEAR vault that makes an AI agent earn its spending power by passing surprise scam drills."
version = "0.1.0"
edition = "2021"
# NEAR's runtime does not accept some WebAssembly features that newer Rust
# turns on by default, so the contract is built with Rust 1.86.
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/A-L-E-XX/NEARHAKATON"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
