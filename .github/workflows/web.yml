name: Web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

jobs:
  build:
    name: Build and screenshot the site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Type check and build
        run: npm run build
      - name: Take screenshots against live testnet data
        run: |
          npx playwright install --with-deps chromium
          (npm run preview > preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run screenshots
      - name: Put the screenshots on the screenshots branch
        if: github.event_name != 'pull_request'
        working-directory: web/screenshots
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Site screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: web/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
