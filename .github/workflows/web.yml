name: Web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

jobs:
  build:
    name: Build and screenshot the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Type check and build
        run: npm run build
      - name: Take screenshots against live testnet data
        run: |
          npx playwright install --with-deps chromium
          (npm run preview > preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: web/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
