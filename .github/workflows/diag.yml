name: Diagnose refusals
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      VAULT: wasback-vault.testnet
    steps:
      - name: Install NEAR CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/latest/download/near-cli-rs-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Stranger
        run: |
          S="pb-diag-${GITHUB_RUN_ID}.testnet"
          near account create-account sponsor-by-faucet-service "$S" autogenerate-new-keypair save-to-legacy-keychain network-config testnet create > /dev/null 2>&1
          try() { echo "=== ${4:-$VAULT} $1 (deposit $3)"; near contract call-function as-transaction "${4:-$VAULT}" "$1" json-args "$2" prepaid-gas '30.0 Tgas' attached-deposit "$3" sign-as "$S" network-config testnet sign-with-legacy-keychain send 2>&1 | grep -E "ExecutionError|panicked|Error:" | head -3; }
          try ft_transfer '{"receiver_id":"testnet","amount":"1"}' '0 NEAR' wrap.testnet
          try storage_withdraw '{}' '0 NEAR' wrap.testnet
          try freeze '{}' '0 NEAR'
