name: Diagnose refusals

# Builds the contract three ways, deploys each to a throwaway account, and checks
# whether a refused call reports its message or just traps.
on:
  workflow_dispatch:

jobs:
  variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [current, no-wasm-opt, cargo-near]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"
          targets: wasm32-unknown-unknown
      - name: Build
        working-directory: contract
        run: |
          mkdir -p ../dist
          case "${{ matrix.variant }}" in
            current)
              RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release
              sudo apt-get update -qq && sudo apt-get install -y -qq binaryen
              wasm-opt -Oz --signext-lowering target/wasm32-unknown-unknown/release/drill_vault.wasm -o ../dist/v.wasm ;;
            no-wasm-opt)
              RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release
              cp target/wasm32-unknown-unknown/release/drill_vault.wasm ../dist/v.wasm ;;
            cargo-near)
              curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
              cargo near build non-reproducible-wasm 2>&1 | tail -15
              find target -name '*.wasm' -path '*near*' | head
              cp "$(find target/near -name 'drill_vault.wasm' | head -1)" ../dist/v.wasm ;;
          esac
          ls -l ../dist/v.wasm
      - name: Install NEAR CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/latest/download/near-cli-rs-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Deploy and refuse
        run: |
          V="pb-diag-${{ matrix.variant }}-${GITHUB_RUN_ID}.testnet"
          S="pb-diags-${{ matrix.variant }}-${GITHUB_RUN_ID}.testnet"
          near account create-account sponsor-by-faucet-service "$V" autogenerate-new-keypair save-to-legacy-keychain network-config testnet create > /dev/null 2>&1
          near account create-account sponsor-by-faucet-service "$S" autogenerate-new-keypair save-to-legacy-keychain network-config testnet create > /dev/null 2>&1
          sleep 2
          near contract deploy "$V" use-file dist/v.wasm with-init-call new json-args "{\"owner_id\":\"$V\",\"agent_id\":\"$V\"}" \
            prepaid-gas '100.0 Tgas' attached-deposit '0 NEAR' network-config testnet sign-with-legacy-keychain send 2>&1 | grep -E "succeeded|Error|rror" | head -3
          echo "=== ${{ matrix.variant }}: stranger calls freeze"
          near contract call-function as-transaction "$V" freeze json-args '{}' prepaid-gas '30.0 Tgas' attached-deposit '0 NEAR' \
            sign-as "$S" network-config testnet sign-with-legacy-keychain send 2>&1 | grep -E "ExecutionError|panicked" | head -2
          echo "=== ${{ matrix.variant }}: stranger calls unfreeze with 1 yocto"
          near contract call-function as-transaction "$V" unfreeze json-args '{}' prepaid-gas '30.0 Tgas' attached-deposit '1 yoctoNEAR' \
            sign-as "$S" network-config testnet sign-with-legacy-keychain send 2>&1 | grep -E "ExecutionError|panicked" | head -2
