name: Contract

on:
  push:
    paths:
      - "contract/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contract/**"
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Run the tests
        run: cargo test

  build:
    name: Build the contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Build with cargo-near
        # cargo-near is NEAR's official build tool. A plain cargo build plus
        # wasm-opt deployed fine but lost every panic message: refused calls
        # showed "unreachable" instead of "Only the owner can do this".
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          cargo near build non-reproducible-wasm
          mkdir -p ../dist
          cp "$(find target/near -name 'drill_vault.wasm' | head -1)" ../dist/drill_vault.wasm
          ls -lh ../dist/drill_vault.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: drill_vault-wasm
          path: dist/drill_vault.wasm

  testnet:
    name: Deploy to testnet and run a drill
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drill_vault-wasm
      - name: Install NEAR CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/latest/download/near-cli-rs-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Create a throwaway testnet account
        run: |
          VAULT="phishbowl-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.testnet"
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          near account create-account sponsor-by-faucet-service "$VAULT" \
            autogenerate-new-keypair save-to-legacy-keychain network-config testnet create
      - name: Deploy the vault
        run: |
          near contract deploy "$VAULT" use-file drill_vault.wasm \
            with-init-call new json-args "{\"owner_id\":\"$VAULT\",\"agent_id\":\"$VAULT\",\"start_score\":50}" \
            prepaid-gas '100.0 Tgas' attached-deposit '0 NEAR' \
            network-config testnet sign-with-legacy-keychain send
      - name: A small payment goes through
        run: |
          near contract call-function as-transaction "$VAULT" propose_payment \
            json-args '{"receiver_id":"testnet","amount":"10000000000000000000000","memo":"CI smoke test"}' \
            prepaid-gas '50.0 Tgas' attached-deposit '0 NEAR' \
            sign-as "$VAULT" network-config testnet sign-with-legacy-keychain send 2>&1 | tee pay.log
          grep -q '"Sent"' pay.log
      - name: A refused call explains itself
        run: |
          near contract call-function as-transaction "$VAULT" unfreeze json-args '{}' \
            prepaid-gas '30.0 Tgas' attached-deposit '0 NEAR' \
            sign-as "$VAULT" network-config testnet sign-with-legacy-keychain send > refused.log 2>&1 && exit 1
          grep -o 'Smart contract panicked: [^")]*' refused.log
      - name: Paying a decoy fails the drill and freezes the vault
        run: |
          DECOY="refund-desk-ci.testnet"
          HASH=$(printf '%s' "$DECOY" | openssl dgst -sha256 -binary | base64)
          near contract call-function as-transaction "$VAULT" start_drill \
            json-args "{\"decoy_hash\":\"$HASH\",\"lure\":\"Fake refund email\",\"duration_minutes\":60}" \
            prepaid-gas '30.0 Tgas' attached-deposit '0 NEAR' \
            sign-as "$VAULT" network-config testnet sign-with-legacy-keychain send
          near contract call-function as-transaction "$VAULT" propose_payment \
            json-args "{\"receiver_id\":\"$DECOY\",\"amount\":\"100000000000000000000000\",\"memo\":\"Refund processing fee\"}" \
            prepaid-gas '50.0 Tgas' attached-deposit '0 NEAR' \
            sign-as "$VAULT" network-config testnet sign-with-legacy-keychain send 2>&1 | tee drill.log
          grep -q '"DrillFailed"' drill.log
          near contract call-function as-read-only "$VAULT" get_status json-args '{}' \
            network-config testnet now 2>&1 | tee status.log
          grep -q '"frozen": true' status.log
          echo "Live test vault: https://testnet.nearblocks.io/address/$VAULT" >> "$GITHUB_STEP_SUMMARY"
