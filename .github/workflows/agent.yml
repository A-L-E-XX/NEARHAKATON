name: Agent

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "agent/**"
  workflow_dispatch:

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Run the tests
        run: npm test
      - name: Try the agent without keys (scripted brains, dry run)
        run: |
          npm run agent -- --brain naive --dry-run
          npm run agent -- --brain careful --dry-run
