[package]
name = "vault-factory"
description = "Creates a Phishbowl vault and a vault-only agent account for anyone who asks, and remembers which wallet owns which vault."
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/A-L-E-XX/NEARHAKATON"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.20", features = ["global-contracts"] }

[dev-dependencies]
near-sdk = { version = "5.20", features = ["global-contracts", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
